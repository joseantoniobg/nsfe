services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nfe
      POSTGRES_PASSWORD: nfe
      POSTGRES_DB: nfe
    ports:
      - "5433:5432"
    volumes:
      - nfe-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfe"]
      interval: 5s
      retries: 10

volumes:
  nfe-db:
